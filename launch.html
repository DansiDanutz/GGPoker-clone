<!doctype html><html lang=en><meta charset=utf-8><title>DanGG · Player login</title><link rel="icon" type="image/png" sizes="512x512" href="/home-art/dangg-logo-512-transparent.png"><style>*{box-sizing:border-box}body{margin:0;background:#141417;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{padding:34px;width:min(420px,96vw);background:#242428;border:1px solid #474749;border-radius:12px}small{color:#edc787;letter-spacing:.12em}label,input{display:block;width:100%;margin:12px 0}input,button{font:inherit;padding:10px;border-radius:5px;border:1px solid #555}button{color:white;background:#8d232c;cursor:pointer}output{display:block;color:#ffcf9e;margin-top:12px}.appLogo{display:block;width:128px;height:128px;object-fit:contain;margin:0 auto 24px}</style><main><img class="appLogo" src="/home-art/dangg-logo-512-transparent.png" alt="DanGG"><small>LOCAL PLAY MONEY</small><h1>Player login</h1><p>Use a nickname and PIN just for this Mac.</p><form hidden><label>Local nickname<input name="nickname" required pattern="[a-zA-Z0-9][a-zA-Z0-9_\-]{1,19}" maxlength="20"></label><label>Six-digit local PIN<input name="pin" type=password required pattern="[0-9]{6}" maxlength=6 inputmode=numeric></label><button value="login">Sign in</button> <button value="create">Create local player</button><output aria-live=polite></output></form></main><script type=module>const f=document.querySelector('form');let signedIn=false;try{signedIn=(await fetch('/local/me')).ok}catch{}if(signedIn)location.replace('/playgg.html?player');else{f.hidden=false;f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/local/'+e.submitter.value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.nickname.value,pin:f.pin.value})});if(!r.ok)throw Error((await r.json()).error);location.assign('/playgg.html?player')}catch(err){f.querySelector('output').textContent=err.message}}}</script></html>
