<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Room · Poker practice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#f6f4eb;font:16px/1.5 system-ui}main{max-width:900px;margin:auto;padding:3vw}h1{font:clamp(36px,7vw,68px) Georgia,serif;margin:.2em 0}.sub{color:#a8c1b9}section,details{padding:18px;margin:14px 0;background:#1d2829;border-radius:12px}#felt{text-align:center;background:#155646;border:6px solid #775b40;border-radius:60px;padding:24px 12px}.cards{display:flex;justify-content:center;gap:7px;min-height:52px}b.card{display:inline-grid;place-items:center;background:#fff9e9;color:#20292d;border-radius:6px;width:42px;height:52px;font:bold 21px Georgia}.card.red{color:#b32830}.card.back{background:#29363d;color:#e7c998}button,input{font:inherit;border-radius:6px;padding:8px 14px;margin:4px}button{cursor:pointer;border:1px solid #ab976d;background:#eaca8a;color:#1d211d}label{display:inline-block}summary{cursor:pointer}#status{font-weight:650}ol{max-height:140px;overflow:auto}small{color:#bfd1c9}
</style><main><span class="sub">PRIVATE PRACTICE CLUB</span><h1>River Room</h1><p>Heads-up fixed-limit Texas Hold’em · practice chips only</p>
<section id="felt"><small id="op"></small><div class="cards" id="opp"></div><p id="street"></p><div class="cards" id="board"></div><p id="pot"></p><div class="cards" id="hero"></div><small id="you"></small></section>
<section><div id="status" aria-live="polite"></div><div id="actions"></div><details><summary>Hand history</summary><ol id="log"></ol></details></section>
<details><summary>Owner · table settings</summary><form id="settings"><label>Practice buy-in <input id="stack" type="number" min="8" max="1000000" required></label><label>Big blind <input id="blind" type="number" min="2" step="2" required></label><button>Save for next hand</button><p id="notice" role="status"></p></form><small>Controls apply to this browser only. Each practice hand starts with fresh stacks.</small></details>
<script type="module" src="./ui.mjs"></script></main></html>
