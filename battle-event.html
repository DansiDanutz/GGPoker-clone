<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle Royale tournament lobby</title><link rel="stylesheet" href="/battle-event.css"><body><main id="eventLobby">
<header><a href="/playgg.html?player&view=battle&battlePage=list">← Game List</a><h1 id="eventName">Battle Royale</h1><p id="eventSummary"></p><p id="eventStatus" role="status">Connecting…</p><button id="eventEntry" disabled>Register</button></header>
<section id="eventRules" class="pane" aria-label="How to Play"><nav><button type="button" aria-pressed="true" aria-disabled="true" tabindex="-1">How to Play</button></nav><article><h2>Rush Stage</h2><p id="rushRule"></p><p id="qualificationRule"></p><h2>Final Table</h2><p id="bountyRule"></p><p id="prizeRule"></p></article></section>
<section id="eventMain" class="pane"><nav aria-label="Tournament information"><button data-main="info" aria-pressed="true">Info</button><button data-main="structure" aria-pressed="false">Structure</button><button data-main="payout" aria-pressed="false">Prize Pool</button></nav><article id="eventMainBody"></article></section>
<section id="eventPeople" class="pane"><nav aria-label="Players and tables"><button data-list="players" aria-pressed="true">Players</button><button data-list="tables" aria-pressed="false">Tables</button></nav><div id="eventRows"></div><button id="eventOpen" disabled>Open</button></section>
<p id="eventError" role="alert"></p><small>Local play-money tournament</small></main>
<dialog id="eventCancel" aria-label="Unregister from Battle Royale"><form method="dialog"><h2>Unregister</h2><p id="eventCancelText"></p><button value="no" autofocus>No</button><button value="ok">OK</button></form></dialog><script type="module" src="/battle-event.mjs"></script></body></html>
