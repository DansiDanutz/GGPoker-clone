<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle Royale tournament lobby</title><link rel="stylesheet" href="/battle-event.css"><link rel="preload" as="image" href="/home-art/native-tourney-entry-up.png"><link rel="preload" as="image" href="/home-art/native-tourney-entry-down.png"><link rel="preload" as="image" href="/home-art/native-tourney-entry-disabled.png"><link rel="preload" as="image" href="/home-art/native-tourney-entry-shadow.png"><body><main id="eventLobby">
<header><a href="/playgg.html?player&view=battle&battlePage=list">← Game List</a><h1 id="eventName">Battle Royale</h1><p id="eventSummary"></p><p id="eventStatus" role="status">Connecting…</p><button id="eventEntry" disabled><span>Register</span></button></header>
<section id="eventRules" class="pane" aria-label="How to Play"><nav><button type="button" aria-pressed="true" aria-disabled="true" tabindex="-1"><span>How to Play</span></button></nav><article><h2>Rush Stage</h2><p id="rushRule"></p><p id="qualificationRule"></p><h2>Final Table</h2><p id="bountyRule"></p><p id="prizeRule"></p></article></section>
<section id="eventMain" class="pane"><nav aria-label="Tournament information"><button data-main="info" aria-pressed="true"><span>Info</span></button><button data-main="structure" aria-pressed="false"><span>Structure</span></button><button data-main="payout" aria-pressed="false"><span>Prize Pool</span></button></nav><article id="eventMainBody"></article></section>
<section id="eventPeople" class="pane"><nav aria-label="Players and tables"><button data-list="players" aria-pressed="true"><span>Players</span></button><button data-list="tables" aria-pressed="false"><span>Tables</span></button></nav><form id="eventPlayerSearch" hidden role="search"><input id="eventPlayerQuery" aria-label="Find a Player" placeholder="Find a Player" maxlength="30" autocomplete="off"><button id="eventPlayerSearchSubmit" aria-label="Search players">⌕</button><button id="eventPlayerSearchClose" type="button" aria-label="Reset player search" hidden>Reset</button></form><div id="eventRows"></div><button id="eventOpen" disabled>Open</button></section>
<p id="eventError" role="alert"></p><small>Local play-money tournament</small></main>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="tourneyDisabledColor" x="-20%" y="-30%" width="140%" height="180%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3333333333333333 0.3333333333333333 0.3333333333333333 0 0 0.3333333333333333 0.3333333333333333 0.3333333333333333 0 0 0.3333333333333333 0.3333333333333333 0.3333333333333333 0 0 0 0 0 1 0"/></filter></defs></svg><dialog id="eventCancel" aria-label="Unregister from Battle Royale"><form method="dialog"><h2>Unregister</h2><p id="eventCancelText"></p><button value="no" autofocus>No</button><button value="ok">OK</button></form></dialog><script type="module" src="/battle-event.mjs"></script></body></html>
